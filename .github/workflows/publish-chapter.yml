name: Publish chapters from inbox

on:
  push:
    branches: [claude/dreamweaver-novel-site-dchwsj]
    paths: ["inbox/**"]

permissions:
  contents: write

concurrency:
  group: inbox
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: sudo apt-get update -q && sudo apt-get install -y -q pandoc

      - name: Convert uploads to chapters
        run: python3 scripts/convert_inbox.py

      - name: Commit the new chapters
        run: |
          git config user.name "dreamweaver-inbox"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "Publish chapter(s) from inbox"
            git push
          fi
